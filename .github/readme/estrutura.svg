<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="462" viewBox="0 0 1200 462" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Estrutura de estetica-automotiva</title>
<desc id="desc">src/: todo o código Java · App.java: ponto de entrada + dados de exemplo · Gerenciamento.java: regras de negócio e menus · Pessoa.java: classe pai · Cliente.java: filha de Pessoa · Funcionario.java: filha de Pessoa · Veiculo.java: entidade do domínio · Servico.java: entidade do domínio · Agendamento.java: cliente + veículo + serviço · .gitignore: ignora bin/ e configs de IDE · README.md</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" opacity=".06"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".22"/></pattern>
<clipPath id="card"><rect width="1200" height="462" rx="10"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="462" fill="#191817"/>
<rect width="1200" height="462" fill="url(#grid)"/>
<rect width="1200" height="40" fill="#262422"/>
<rect y="40" width="1200" height="1" fill="#3a3733"/>
<rect x="20" y="14" width="12" height="12" fill="#e5534b"/>
<rect x="40" y="14" width="12" height="12" fill="#e0a43b"/>
<rect x="60" y="14" width="12" height="12" fill="#5fb85f"/>
<text x="600" y="25" text-anchor="middle" class="mono" font-size="14" fill="#86817a">estrutura</text>
