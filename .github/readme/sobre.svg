<text x="70" y="149" class="mono" font-size="16" fill="#b7b2aa" xml:space="preserve">pilares de<tspan font-weight="700" fill="#ece9e4"> Programação</tspan><tspan font-weight="700" fill="#ece9e4"> Orientada</tspan><tspan font-weight="700" fill="#ece9e4"> a</tspan><tspan font-weight="700" fill="#ece9e4"> Objetos</tspan>, com foco em encapsulamento e herança.</text>
