<title id="title">Sobre estetica-automotiva</title>
<desc id="desc">Sistema de agendamentos para uma estética automotiva, feito em Java e executado no terminal, para praticar os pilares de Programação Orientada a Objetos, com foco em encapsulamento e herança.</desc>
