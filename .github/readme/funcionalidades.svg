<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Funcionalidades de estetica-automotiva</title>
<desc id="desc">Cadastros: Clientes, funcionários, veículos e serviços, pelo menu de cadastros no terminal. · Agendamento de serviços: Liga cliente, veículo e serviço com data e horário, e permite concluir ou cancelar. · Listagens: Lista clientes, funcionários, veículos, serviços e agendamentos, com o status de cada agendamento. · Busca e remoção: Busca de clientes e veículos e remoção de qualquer cadastro. · Herança: Cliente e Funcionario herdam os dados comuns da classe pai Pessoa. · Encapsulamento: Atributos privados, acessados só por getters e setters.</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" opacity=".06"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".22"/></pattern>
<clipPath id="card"><rect width="1200" height="490" rx="10"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="490" fill="#191817"/>
<rect width="1200" height="490" fill="url(#grid)"/>
<rect width="1200" height="40" fill="#262422"/>
<rect y="40" width="1200" height="1" fill="#3a3733"/>
<rect x="20" y="14" width="12" height="12" fill="#e5534b"/>
<rect x="40" y="14" width="12" height="12" fill="#e0a43b"/>
<rect x="60" y="14" width="12" height="12" fill="#5fb85f"/>
<text x="600" y="25" text-anchor="middle" class="mono" font-size="14" fill="#86817a">funcionalidades.md</text>
<rect x="48" y="78" width="10" height="10" fill="#d97757"/>
<text x="70" y="88" class="mono" font-size="18" font-weight="700" fill="#ece9e4">Funcionalidades</text>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.952;1" dur="0.2s" fill="freeze"/>
<rect x="48.5" y="116.5" width="528" height="102" rx="6" fill="#121110" stroke="#3a3733"/>
<rect x="68" y="138" width="8" height="8" fill="#d97757"/>
<text x="86" y="147" class="mono" font-size="16" font-weight="700" fill="#ece9e4">Cadastros</text>
<text x="68" y="174" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve"><tspan font-weight="700" fill="#ece9e4">Clientes</tspan>,<tspan font-weight="700" fill="#ece9e4"> funcionários</tspan>,<tspan font-weight="700" fill="#ece9e4"> veículos</tspan> e<tspan font-weight="700" fill="#ece9e4"> serviços</tspan>, pelo menu de</text>
<text x="68" y="196" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">cadastros no terminal.</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.968;1" dur="0.3s" fill="freeze"/>
<rect x="624.5" y="116.5" width="528" height="102" rx="6" fill="#121110" stroke="#3a3733"/>
<rect x="644" y="138" width="8" height="8" fill="#d97757"/>
<text x="662" y="147" class="mono" font-size="16" font-weight="700" fill="#ece9e4">Agendamento de serviços</text>
<text x="644" y="174" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">Liga cliente, veículo e serviço com data e horário, e</text>
<text x="644" y="196" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">permite<tspan font-weight="700" fill="#ece9e4"> concluir</tspan> ou<tspan font-weight="700" fill="#ece9e4"> cancelar</tspan>.</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.976;1" dur="0.4s" fill="freeze"/>
<rect x="48.5" y="234.5" width="528" height="102" rx="6" fill="#121110" stroke="#3a3733"/>
<rect x="68" y="256" width="8" height="8" fill="#d97757"/>
<text x="86" y="265" class="mono" font-size="16" font-weight="700" fill="#ece9e4">Listagens</text>
<text x="68" y="292" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">Lista clientes, funcionários, veículos, serviços e</text>
<text x="68" y="314" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">agendamentos, com o status de cada agendamento.</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.984;1" dur="0.6s" fill="freeze"/>
<rect x="624.5" y="234.5" width="528" height="102" rx="6" fill="#121110" stroke="#3a3733"/>
<rect x="644" y="256" width="8" height="8" fill="#d97757"/>
<text x="662" y="265" class="mono" font-size="16" font-weight="700" fill="#ece9e4">Busca e remoção</text>
<text x="644" y="292" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve"><tspan font-weight="700" fill="#ece9e4">Busca</tspan> de clientes e veículos e<tspan font-weight="700" fill="#ece9e4"> remoção</tspan> de qualquer</text>
<text x="644" y="314" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">cadastro.</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.986;1" dur="0.7s" fill="freeze"/>
