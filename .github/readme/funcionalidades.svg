<rect x="68" y="374" width="8" height="8" fill="#d97757"/>
<text x="86" y="383" class="mono" font-size="16" font-weight="700" fill="#ece9e4">Herança</text>
<text x="68" y="410" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve"><tspan font-weight="700" fill="#ece9e4">Cliente</tspan> e<tspan font-weight="700" fill="#ece9e4"> Funcionario</tspan> herdam os dados comuns da classe</text>
<text x="68" y="432" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">pai<tspan font-weight="700" fill="#ece9e4"> Pessoa</tspan>.</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.988;1" dur="0.8s" fill="freeze"/>
<rect x="624.5" y="352.5" width="528" height="102" rx="6" fill="#121110" stroke="#3a3733"/>
<rect x="644" y="374" width="8" height="8" fill="#d97757"/>
<text x="662" y="383" class="mono" font-size="16" font-weight="700" fill="#ece9e4">Encapsulamento</text>
<text x="644" y="410" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">Atributos<tspan font-weight="700" fill="#ece9e4"> privados</tspan>, acessados só por getters e setters.</text>
</g>
<rect width="1200" height="490" fill="url(#scan)"/>
